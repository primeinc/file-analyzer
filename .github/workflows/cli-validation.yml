name: CLI Validation and Testing

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  cli-validation:
    name: CLI Functionality Validation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y exiftool tesseract-ocr clamav rdfind ripgrep
        # Note: binwalk is optional for CI
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install uv
        uv sync --dev
        
    - name: Verify CLI installation
      run: |
        # Test that fa command is available
        uv run fa --version
        uv run fa --help
        
    - name: Test CLI basic functionality
      run: |
        # Test core commands don't crash
        uv run fa quick --help
        uv run fa analyze --help
        uv run fa model --help
        uv run fa test --help
        uv run fa validate --help
        
    - name: Test CLI error handling
      run: |
        # Test error conditions return proper exit codes
        if uv run fa quick /nonexistent/file.jpg 2>/dev/null; then
          echo "ERROR: Quick command should fail for non-existent file"
          exit 1
        fi
        echo "✅ Error handling works correctly"
        
    - name: Test analyze verify
      run: |
        # Test dependency verification
        uv run fa analyze verify
        
    - name: Run comprehensive CLI tests
      run: |
        uv run pytest tests/test_cli_integrations.py -v --tb=short
        
    - name: Test artifact discipline
      run: |
        # Test artifact discipline check
        chmod +x ./scripts/preflight.sh
        ./scripts/preflight.sh
        
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install uv
        uv sync --dev
        
    - name: Run ruff formatting check
      run: |
        uv run ruff format --check --diff src/ tests/
        
    - name: Run ruff linting check
      run: |
        uv run ruff check src/ tests/
        
    - name: Run type checking with mypy
      run: |
        # Use mypy configuration from pyproject.toml without overrides
        uv run mypy src/
        
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [cli-validation, code-quality]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y exiftool tesseract-ocr clamav rdfind ripgrep
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install uv
        uv sync --dev
        
    - name: Create test data
      run: |
        mkdir -p test_data/images
        # Create a simple test image using Python
        uv run python -c "
from PIL import Image
img = Image.new('RGB', (100, 100), color='red')
img.save('test_data/images/test.jpg')
print('Created test image')
        "
        
    - name: Test end-to-end workflows
      run: |
        # Test complete analysis workflow
        uv run fa analyze verify
        uv run fa analyze metadata test_data/images/ || echo "Metadata analysis completed"
        
        # Test quick analysis
        uv run fa quick test_data/images/test.jpg || echo "Quick analysis completed"
        
    - name: Test model commands
      run: |
        # Test model management (without actually downloading large models)
        uv run fa model list
        uv run fa model --help
        
    - name: Run all unit tests
      run: |
        uv run pytest tests/ -v --tb=short --maxfail=5 --cov=src --cov-report=xml
        
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
        
  pre-commit-validation:
    name: Pre-commit Hook Validation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install uv
        uv sync --dev
        
    - name: Install system dependencies for CLI tests
      run: |
        sudo apt-get update
        sudo apt-get install -y exiftool tesseract-ocr clamav rdfind ripgrep
        
    - name: Install pre-commit hooks
      run: |
        uv run pre-commit install
        
    - name: Run pre-commit on all files
      run: |
        uv run pre-commit run --all-files --verbose