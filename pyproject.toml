[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "file-analyzer"
version = "0.2.0"
description = "A unified tool for comprehensive file analysis"
authors = [
    {name = "The File Analyzer Team"}
]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "typer>=0.9.0",
    "plumbum>=1.8.0",
    "jsonschema>=4.17.0",
    "pillow>=9.0.0",
    "pixelmatch>=0.3.0",
    "imagehash>=4.3.1",
    "scikit-image>=0.19.0",
    "python-json-logger>=2.0.0",
    "pathvalidate>=3.3.1,<4.0.0",
    "json-repair>=0.51.0,<0.52.0",
    # Modern document processing
    "docling>=1.0.0",
    "markitdown>=0.0.1",
    # Cross-platform ML and model support
    "transformers>=4.40.0",
    "torch>=2.0.0",
    "accelerate>=0.30.0",
    "safetensors>=0.4.0",
    # Additional processing utilities
    "pypandoc>=1.13",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "pydantic>=2.11.9,<3.0.0",
    "pydantic-settings>=2.11.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.0.0",
    "syrupy>=4.0.0",
    "ruff>=0.6.0",
    "mypy>=1.8.0",
    "pre-commit>=3.0.0",
    "coverage[toml]>=7.0.0",
]

vision = [
    # Legacy MLX support (Apple Silicon only)
    "mlx>=0.3.0; sys_platform == 'darwin'",
    "mlx-vlm>=0.0.10; sys_platform == 'darwin'",
    # Modern cross-platform vision support
    "sentence-transformers>=2.7.0",
    "opencv-python>=4.8.0",
    "timm>=0.9.0",
    "datasets>=2.18.0",
]

[project.urls]
"Homepage" = "https://github.com/primeinc/file-analyzer"
"Bug Tracker" = "https://github.com/primeinc/file-analyzer/issues"

[project.scripts]
fa = "src.cli.main:app"

[tool.setuptools]
# Use find-packages for more reliable package discovery
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"schemas" = ["**/*.json"]

[project.entry-points."fa.commands"]
analyze = "src.cli.analyze.main:app"
test = "src.cli.test.main:app"
validate = "src.cli.validate.main:app"
artifact = "src.cli.artifact.main:app"
install = "src.cli.install.main:app"
model = "src.cli.model.main:app"
benchmark = "src.cli.benchmark.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "vision: marks tests that require vision models",
    "cli: marks tests for CLI commands",
]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "PIE", # flake8-pie
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "B905",  # zip without explicit strict parameter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["src"]
force-single-line = false
lines-after-imports = 2

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Start lenient, can tighten later
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
show_column_numbers = true

[[tool.mypy.overrides]]
module = [
    "mlx.*",
    "pixelmatch.*",
    "imagehash.*",
    "skimage.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__init__.py",
    "*/conftest.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
show_missing = true
skip_covered = false
fail_under = 80
precision = 2

[tool.coverage.html]
directory = "htmlcov"

[dependency-groups]
dev = [
    "coverage[toml]>=7.0.0",
    "mypy>=1.8.0",
    "pre-commit>=3.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.0.0",
    "ruff>=0.6.0",
    "syrupy>=4.0.0",
]
